<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Configuration Snippets</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1><i class="fas fa-code"></i> Device Configuration Snippets</h1>
            <p>Configuration code snippets for IP phones and devices</p>
        </div>
    </header>

    <nav class="nav">
        <div class="container">
            <div class="nav-buttons" id="navButtons">
                <!-- dynamically populated -->
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search snippets..." class="search-input">
                <i class="fas fa-search search-icon"></i>
            </div>
        </div>
    </nav>

    <main class="main">
        <div class="container">
            <div class="toolbar">
                <a id="addSnippetBtn" class="btn btn-primary" href="https://vonage.enterprise.slack.com/archives/C0BUBBARRMW" target="_blank" rel="noopener">
                    <i class="fab fa-slack"></i> Submit New Snippet via Slack
                </a>
                <div class="view-options">
                    <button id="gridViewBtn" class="view-btn active" title="Grid View">
                        <i class="fas fa-th"></i>
                    </button>
                    <button id="listViewBtn" class="view-btn" title="List View">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>

            <div id="snippetsContainer" class="snippets-container grid-view">
                <!-- Snippets will be dynamically loaded here -->
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
